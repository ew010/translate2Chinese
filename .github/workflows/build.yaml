name: Build AI Translator Apps

# 触发条件：允许在 GitHub 网页上手动点击运行
on:
  workflow_dispatch: 

jobs:
  build:
    # 矩阵构建：同时在最新的 Mac 和 Windows 机器上运行
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 3.11 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' 

    - name: 安装依赖库
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller llama-cpp-python

    - name: [Mac] 执行打包
      if: matrix.os == 'macos-latest'
      run: |
        # 自动获取 Mac 下的库路径并打包 (包含 Metal 加速文件)
        LLAMA_PATH=$(python -c "import llama_cpp, os; print(os.path.dirname(llama_cpp.__file__))")
        pyinstaller --clean --noconfirm --onedir --windowed --name "AITranslator" --add-data "$LLAMA_PATH:llama_cpp" --add-data "$LLAMA_PATH/lib/*metal*:." v3_gui.py
        # 将生成的 App 压缩成 zip
        cd dist
        zip -r ../AITranslator_macOS.zip AITranslator.app

    - name: [Windows] 执行打包
      if: matrix.os == 'windows-latest'
      run: |
        # 自动获取 Windows 下的库路径并打包 (注意分隔符是分号)
        $LLAMA_PATH = python -c "import llama_cpp, os; print(os.path.dirname(llama_cpp.__file__))"
        pyinstaller --clean --noconfirm --onedir --windowed --name "AITranslator" --add-data "$LLAMA_PATH;llama_cpp" v3_gui.py
        # 将生成的文件夹压缩成 zip
        Compress-Archive -Path dist\AITranslator -DestinationPath AITranslator_Windows.zip

    - name: 上传 Mac 产物
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: AITranslator-macOS
        path: AITranslator_macOS.zip

    - name: 上传 Windows 产物
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: AITranslator-Windows
        path: AITranslator_Windows.zip
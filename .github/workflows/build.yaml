name: Build AI Translator

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller llama-cpp-python

    - name: Build Mac App
      if: matrix.os == 'macos-latest'
      run: |
        LLAMA_PATH=$(python -c "import llama_cpp, os; print(os.path.dirname(llama_cpp.__file__))")
        pyinstaller --clean --noconfirm --onedir --windowed --name "AITranslator" --add-data "$LLAMA_PATH:llama_cpp" --add-data "$LLAMA_PATH/lib/*metal*:." v3_gui.py
        cd dist
        zip -r ../AITranslator_macOS.zip AITranslator.app

    - name: Build Windows App
      if: matrix.os == 'windows-latest'
      run: |
        $LLAMA_PATH = python -c "import llama_cpp, os; print(os.path.dirname(llama_cpp.__file__))"
        pyinstaller --clean --noconfirm --onedir --windowed --name "AITranslator" --add-data "$LLAMA_PATH;llama_cpp" v3_gui.py
        Compress-Archive -Path dist\AITranslator -DestinationPath AITranslator_Windows.zip

    - name: Upload Mac Artifact
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: AITranslator-macOS
        path: AITranslator_macOS.zip

    - name: Upload Windows Artifact
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: AITranslator-Windows
        path: AITranslator_Windows.zip

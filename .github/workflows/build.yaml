name: Build AI Translator Apps

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. Windows - AVX2 完整版 (高性能)
  # ==========================================
  build-windows-avx2:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # 默认安装即支持 AVX2，能发挥 CPU 性能
        pip install llama-cpp-python flet pyinstaller

    - name: Build Executable
      run: |
        $LLAMA_PATH = $(python -c "import llama_cpp, os; print(os.path.dirname(llama_cpp.__file__))")
        pyinstaller --clean --noconfirm --onedir --windowed --name "AITranslator_Full" --add-data "$LLAMA_PATH;llama_cpp" v3_gui.py
        Compress-Archive -Path dist\AITranslator_Full -DestinationPath AITranslator_Windows_AVX2.zip

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AITranslator-Windows-AVX2
        path: AITranslator_Windows_AVX2.zip

  # ==========================================
  # 2. Windows - NoAVX2 兼容版 (老机器专用)
  # ==========================================
  build-windows-noavx2:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Compile without AVX2
      run: |
        python -m pip install --upgrade pip
        $env:CMAKE_ARGS="-DLLAMA_AVX=OFF -DLLAMA_AVX2=OFF -DLLAMA_FMA=OFF"
        pip install llama-cpp-python --no-cache-dir --force-reinstall
        pip install flet pyinstaller

    - name: Build Executable
      run: |
        $LLAMA_PATH = $(python -c "import llama_cpp, os; print(os.path.dirname(llama_cpp.__file__))")
        pyinstaller --clean --noconfirm --onedir --windowed --name "AITranslator_NoAVX2" --add-data "$LLAMA_PATH;llama_cpp" v3_gui.py
        Compress-Archive -Path dist\AITranslator_NoAVX2 -DestinationPath AITranslator_Windows_NoAVX2.zip

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AITranslator-Windows-NoAVX2
        path: AITranslator_Windows_NoAVX2.zip

  # ==========================================
  # 3. macOS - Metal 加速版
  # ==========================================
  build-mac:
    runs-on: macos-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Compile with Metal
      run: |
        python -m pip install --upgrade pip
        export CMAKE_ARGS="-DLLAMA_METAL=on"
        pip install llama-cpp-python --no-cache-dir --force-reinstall
        pip install flet pyinstaller

    - name: Build Executable
      run: |
        LLAMA_PATH=$(python -c "import llama_cpp, os; print(os.path.dirname(llama_cpp.__file__))")
        pyinstaller --clean --noconfirm --onedir --windowed --name "AITranslator_Mac" --add-data "$LLAMA_PATH:llama_cpp" v3_gui.py
        cd dist
        zip -r ../AITranslator_Mac_Metal.zip AITranslator_Mac.app
        cd ..

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AITranslator-Mac-Metal
        path: AITranslator_Mac_Metal.zip
